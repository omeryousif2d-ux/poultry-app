name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache git libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk
        pip install --upgrade pip
        pip install buildozer "cython<3.0.0"

    - name: Build APK with Buildozer
      run: |
        buildozer init
        sed -i 's/#requirements = python3,kivy/requirements = python3,kivy,openpyxl,sqlite3/g' buildozer.spec
        sed -i 's/#title = My Application/title = Poultry Manager/g' buildozer.spec
        sed -i 's/# android.ndk = 25b/android.ndk = 25b/g' buildozer.spec
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: PoultryManager-APK
        path: bin/*.apk
